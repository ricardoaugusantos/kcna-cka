apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-client-dns
  namespace: default
spec: 
  podSelector:
    matchLabels:
      app: network-client
  policyTypes: 
    - Egress
  egress:
  - to:
    - namespaceSelector:
        matchExpressions:
          kubernetes.io/metadata.name: kube-system
    ports:
      - protocol: TCP
        port: 53
      - protocol: UDP
        port: 53
