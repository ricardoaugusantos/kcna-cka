apiVersion: v1
kind: Pod

metadata:
  name: pod-com-toleration
  namespace: default

spec:
  tolerations:
    - key: dedicated
      operator: Equal
      value: especial
      effect: NoSchedule

  nodeSelector:
    kubernetes.io/hostname: kcna-cka-lab-worker2

  containers:
    - name: nginx
      image: nginx:stable
      ports:
        - containerPort: 80